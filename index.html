<!DOCTYPE html>
<html>
<head>
<title>Manual WebRTC Chat</title>
<style>
textarea{width:100%;height:120px;margin-top:10px;}
#chat{border:1px solid black;height:200px;overflow:auto;padding:5px;margin-top:10px;}
</style>
</head>
<body>

<h2>Manual WebRTC Chat</h2>

<button id="createOffer">Create Offer</button>
<button id="createAnswer">Create Answer</button>

<h3>Local Description (send this)</h3>
<textarea id="local"></textarea>

<h3>Paste Remote Description</h3>
<textarea id="remote"></textarea>
<button id="setRemote">Set Remote Description</button>

<h3>ICE Candidates (send these)</h3>
<textarea id="iceLocal"></textarea>

<h3>Paste Remote ICE Candidates</h3>
<textarea id="iceRemote"></textarea>
<button id="addIce">Add Remote ICE</button>

<div id="chat"></div>

<input id="msg" placeholder="message">
<button id="send">Send</button>

<script>

const pc = new RTCPeerConnection({
 iceServers:[{urls:"stun:stun.l.google.com:19302"}]
});

let channel;

pc.onicecandidate = e=>{
 if(e.candidate){
  iceLocal.value += JSON.stringify(e.candidate) + "\n";
 }
};

pc.ondatachannel = e=>{
 channel = e.channel;
 setupChannel();
};

function setupChannel(){
 channel.onopen=()=>log("Connected!");
 channel.onmessage=e=>log("Friend: "+e.data);
}

function log(t){
 chat.innerHTML+=t+"<br>";
 chat.scrollTop=chat.scrollHeight;
}

createOffer.onclick = async ()=>{
 channel = pc.createDataChannel("chat");
 setupChannel();

 const offer = await pc.createOffer();
 await pc.setLocalDescription(offer);

 local.value = JSON.stringify(pc.localDescription);
};

createAnswer.onclick = async ()=>{
 const remoteDesc = JSON.parse(remote.value);
 await pc.setRemoteDescription(remoteDesc);

 const answer = await pc.createAnswer();
 await pc.setLocalDescription(answer);

 local.value = JSON.stringify(pc.localDescription);
};

setRemote.onclick = async ()=>{
 const desc = JSON.parse(remote.value);
 await pc.setRemoteDescription(desc);
};

addIce.onclick = async ()=>{
 const lines = iceRemote.value.trim().split("\n");

 for(const line of lines){
  if(line){
   await pc.addIceCandidate(JSON.parse(line));
  }
 }
};

send.onclick = ()=>{
 const text = msg.value;
 channel.send(text);
 log("You: "+text);
 msg.value="";
};

</script>

</body>
</html>
