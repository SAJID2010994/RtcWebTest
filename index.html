<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PeerJS Voice Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: Arial; max-width: 600px; margin: auto; padding: 20px; }
    input, button { padding: 6px; margin: 5px 0; width: 70%; }
    #log { height: 200px; overflow-y: auto; border: 1px solid black; padding: 10px; background: #f5f5f5; }
  </style>
</head>
<body>

<h2>PeerJS Voice Chat (Cloudflare TURN)</h2>

<b>Your Peer ID:</b>
<div id="myId">Connecting...</div>

<input id="peerIdInput" placeholder="Friend Peer ID">
<button onclick="callPeer()">Call</button>

<div id="log"></div>

<h3>Local & Remote Audio</h3>
<audio id="localAudio" autoplay muted></audio>
<audio id="remoteAudio" autoplay></audio>

<script>
let peer, localStream, currentCall;

// log helper
function log(msg, error=false) {
  console[error ? "error":"log"](msg);
  const l = document.getElementById("log");
  l.innerHTML += (error ? "❌ ":"ℹ️ ") + msg + "<br>";
  l.scrollTop = l.scrollHeight;
}

// ============================
// Cloudflare STUN + TURN
// ============================
const iceConfig = {
  iceServers: [
    { urls: "stun:stun.cloudflare.com:3478" },
    {
      urls: [
        "turn:turn.cloudflare.com:3478?transport=udp",
        "turn:turn.cloudflare.com:3478?transport=tcp",
        "turns:turn.cloudflare.com:5349?transport=tcp"
      ],
      username: "g05afd4e013e8557463bea3d4d41470d0adc5fe8c78aa095892fe975ac780b4e",
      credential: "c518271ff742c00025391b37255ec325d0483fefa54ee0ecb71fafc7d8dccdb3"
    }
  ]
};

// ============================
// Initialize PeerJS
// ============================
peer = new Peer({ debug: 3, config: iceConfig });

peer.on("open", id => {
  document.getElementById("myId").innerText = id;
  log("Connected to PeerJS server. ID: " + id);
});

peer.on("error", err => log("Peer error: " + err.type + " → " + err.message, true));
peer.on("disconnected", () => log("Disconnected from PeerJS server", true));

// ============================
// Get microphone access
// ============================
navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => {
    localStream = stream;
    document.getElementById("localAudio").srcObject = stream;
    log("Local microphone ready");
  })
  .catch(err => log("Microphone access denied: " + err, true));

// ============================
// Handle incoming calls
// ============================
peer.on("call", call => {
  log("Incoming call from: " + call.peer);

  call.answer(localStream); // send local audio
  setupCallEvents(call);
});

// ============================
// Call a peer
// ============================
function callPeer() {
  const id = document.getElementById("peerIdInput").value;
  if (!id) { log("Enter peer ID", true); return; }
  if (!localStream) { log("Microphone not ready", true); return; }

  log("Calling " + id + "...");
  const call = peer.call(id, localStream);
  setupCallEvents(call);
}

// ============================
// Call event handlers
// ============================
function setupCallEvents(call) {
  currentCall = call;

  call.on("stream", remoteStream => {
    document.getElementById("remoteAudio").srcObject = remoteStream;
    log("Connected! Receiving remote audio");
  });

  call.on("close", () => log("Call ended", true));
  call.on("error", err => log("Call error: " + err, true));

  // ICE timeout (optional)
  setTimeout(() => {
    if (call.iceConnectionState !== "connected") {
      log("Connection timeout or ICE failed", true);
    }
  }, 10000);
}

</script>
</body>
</html>
