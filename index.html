<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Chat</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>

<h2>PeerJS Chat App</h2>

<b>Your Peer ID:</b>
<div id="myId">Connecting...</div>

<hr>

<input id="peerIdInput" placeholder="Friend Peer ID">
<button onclick="connectPeer()">Connect</button>

<hr>

<div id="chat"
     style="height:200px;overflow:auto;border:1px solid black;padding:5px;">
</div>

<input id="msg" placeholder="Message">
<button onclick="sendMsg()">Send</button>

<script>
let conn;

// ICE servers (STUN + TURN)
const peer = new Peer({
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      {
        urls: "turn:openrelay.metered.ca:80",
        username: "openrelayproject",
        credential: "openrelayproject"
      }
    ]
  }
});

// When connected to PeerJS server
peer.on("open", id => {
  document.getElementById("myId").innerText = id;
});

// Incoming connection
peer.on("connection", connection => {
  setupConnection(connection);
});

function connectPeer() {
  const id = document.getElementById("peerIdInput").value;
  const connection = peer.connect(id);
  setupConnection(connection);
}

function setupConnection(connection) {
  conn = connection;

  conn.on("open", () => {
    addChat("✅ Connected!");
  });

  conn.on("data", data => {
    addChat("Friend: " + data);
  });

  conn.on("close", () => {
    addChat("❌ Disconnected");
  });
}

function sendMsg() {
  const input = document.getElementById("msg");
  const message = input.value;

  if (!conn || !conn.open) {
    alert("Not connected!");
    return;
  }

  conn.send(message);
  addChat("You: " + message);

  input.value = "";
}

function addChat(text) {
  const chat = document.getElementById("chat");
  chat.innerHTML += text + "<br>";
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
