<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Socket.IO Chat</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
    #messages { list-style-type: none; padding: 0; max-height: 300px; overflow-y: scroll; }
    #messages li { padding: 5px 10px; background: #fff; margin-bottom: 5px; border-radius: 5px; }
    #chat-form { display: flex; }
    #chat-form input { flex: 1; padding: 10px; font-size: 16px; }
    #chat-form button { padding: 10px; font-size: 16px; }
  </style>
</head>
<body>

<h2>Socket.IO Chat App</h2>

<ul id="messages"></ul>

<form id="chat-form">
  <input id="message-input" autocomplete="off" placeholder="Type your message..." />
  <button>Send</button>
</form>

<!-- Socket.IO client -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script>
  // ⚡ Put your server domain here
  const SERVER_DOMAIN = "http://localhost:3000"; // <-- Replace with your server URL

  const socket = io(SERVER_DOMAIN);

  const form = document.getElementById('chat-form');
  const input = document.getElementById('message-input');
  const messages = document.getElementById('messages');

  // Send message
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value) {
      socket.emit('chat message', input.value);
      input.value = '';
    }
  });

  // Receive messages
  socket.on('chat message', (msg) => {
    const li = document.createElement('li');
    li.textContent = msg;
    messages.appendChild(li);
    messages.scrollTop = messages.scrollHeight;
  });
</script>

</body>
</html>
